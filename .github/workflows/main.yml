name: Daily Empty Commit

on:
  schedule:
    - cron: '0 * * * *'  # Runs hourly, next line: #workflow_dispatch:       # Optional: allows manual run from GitHub UI

jobs:
  daily-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create empty commit
        run: |
          git commit --allow-empty -m "chore: daily empty commit $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

      - name: Push changes
        run: |
          git push https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }} HEAD:main
